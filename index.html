<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>파밭 직거래 - 대파 산지 직거래 플랫폼</title>

    <!-- 글꼴 / 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 네이버 지도 인증 실패(등록되지 않은 주소 등) 시 안내를 띄우기 위한 콜백: 지도 스크립트보다 먼저 정의 -->
    <script>
        window.navermap_authFailure = function () {
            window.__mapAuthFailed = true;
            var el = document.getElementById('map-error');
            if (el) {
                el.classList.remove('hidden');
                var o = document.getElementById('map-error-origin');
                if (o) o.textContent = location.origin;
            }
        };
    </script>
    <!-- 네이버 Maps API -->
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=4ybsftznyl"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <div class="views">

        <!-- ===== 탭 1: 지도 (화면 전체) ===== -->
        <section id="tab-map" class="tab-content view">
            <div id="map-canvas" class="map-canvas">
                <div id="naver-map-inner" class="map-inner"></div>

                <div id="map-error" class="map-error hidden">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <strong>지도를 불러오지 못했어요</strong>
                    <p>네이버 클라우드 콘솔의 Web 서비스 URL에 아래 주소가 등록되어 있는지 확인해 주세요.</p>
                    <code id="map-error-origin"></code>
                </div>
            </div>

            <!-- 상단: 검색 + 거래상태 필터 -->
            <div class="topbar">
                <div class="search">
                    <span class="search__logo"><i class="fa-solid fa-seedling"></i></span>
                    <input type="search" id="search-input" oninput="applyFilters()" placeholder="밭 이름·품종으로 검색" autocomplete="off" enterkeyhint="search" aria-label="등록된 밭 검색">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                </div>

                <input type="hidden" id="filter-status" value="전체">
                <div class="chips" role="group" aria-label="거래 상태 필터">
                    <button type="button" class="chip" data-value="전체" aria-pressed="true" onclick="setStatusFilter('전체')">전체</button>
                    <button type="button" class="chip" data-value="판매중" aria-pressed="false" style="--dot: var(--sale)" onclick="setStatusFilter('판매중')"><span class="chip__dot"></span>판매중</button>
                    <button type="button" class="chip" data-value="예약중" aria-pressed="false" style="--dot: var(--reserved)" onclick="setStatusFilter('예약중')"><span class="chip__dot"></span>예약중</button>
                    <button type="button" class="chip" data-value="내 밭" aria-pressed="false" style="--dot: var(--brand)" onclick="setStatusFilter('내 밭')"><span class="chip__dot"></span>내 밭</button>
                </div>
            </div>

            <!-- 우측 플로팅 버튼 -->
            <div class="fabs">
                <button type="button" class="fab fab--locate" onclick="panToCurrentLocation()" aria-label="내 위치로 이동"><i class="fa-solid fa-location-crosshairs"></i></button>
                <button type="button" class="fab" id="satellite-btn" onclick="toggleSatellite()" aria-label="위성지도 보기" aria-pressed="false"><i class="fa-solid fa-satellite"></i></button>
                <button type="button" class="fab" id="cadastral-btn" onclick="toggleCadastralLayer()" aria-label="지적도 보기" aria-pressed="false"><i class="fa-solid fa-layer-group"></i></button>
            </div>

            <!-- 하단 액션 독 -->
            <div class="dock">
                <button type="button" class="btn btn--ghost" id="measure-btn" onclick="startMeasure()">
                    <i class="fa-solid fa-draw-polygon" style="color: var(--measure)"></i><span>면적재기</span>
                </button>
                <button type="button" class="btn btn--primary" id="register-farm-btn">
                    <i class="fa-solid fa-plus"></i><span>내 땅 등록</span>
                </button>
            </div>

            <!-- 면적 측정 패널 (측정 중에는 독을 대체) -->
            <div id="measure-panel" class="measure-panel" role="region" aria-label="면적 측정">
                <div class="measure__row">
                    <div class="measure__readout">
                        <div class="measure__value" id="measure-area-main">면적 재는 중</div>
                        <div class="measure__hint" id="measure-guide-text">밭 모서리를 차례로 터치하세요</div>
                    </div>
                    <button type="button" class="icon-btn" onclick="undoLastPoint()" aria-label="이전 점 취소"><i class="fa-solid fa-rotate-left"></i></button>
                    <button type="button" class="icon-btn" onclick="resetMeasurePoints()" aria-label="모두 지우기"><i class="fa-solid fa-trash-can"></i></button>
                    <button type="button" class="icon-btn" onclick="cancelMeasure()" aria-label="측정 끝내기"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <button type="button" id="measure-register-btn" class="measure__cta" onclick="openRegisterSheetFromMeasurement()" disabled>이 구역으로 등록</button>
            </div>
        </section>

        <!-- ===== 탭 2: 관심 밭 & 임장 메모 ===== -->
        <section id="tab-saved" class="tab-content view view--page hidden">
            <header class="page-head">
                <h2>관심 밭</h2>
                <p>임장 때 확인한 진입로, 상차 여건을 메모해 두세요.</p>
            </header>
            <div id="saved-list-container" class="stack"></div>
        </section>

        <!-- ===== 탭 3: 활동 & 안심번호 ===== -->
        <section id="tab-activity" class="tab-content view view--page hidden">
            <header class="page-head">
                <h2>활동·문의</h2>
                <p>안심번호로 연결한 통화 기록이에요.</p>
            </header>

            <div class="card secure">
                <div class="secure__icon"><i class="fa-solid fa-user-shield"></i></div>
                <div class="secure__text">
                    <strong>안심번호 보안 통화</strong>
                    <span>내 번호 노출 없이 가상 번호로 통화해요.</span>
                </div>
                <span class="pill">사용 중</span>
            </div>

            <h3 class="section-title">최근 통화</h3>
            <div id="inquiry-log-list" class="stack"></div>
        </section>

    </div>

    <!-- 하단 탭바 -->
    <nav class="tabbar" aria-label="주요 메뉴">
        <button type="button" class="tab nav-btn is-active" onclick="switchTab('map')" data-target="map" aria-current="page">
            <i class="fa-solid fa-map"></i><span>지도</span>
        </button>
        <button type="button" class="tab nav-btn" onclick="switchTab('saved')" data-target="saved">
            <i class="fa-solid fa-heart"></i><span>관심 밭</span>
        </button>
        <button type="button" class="tab nav-btn" onclick="switchTab('activity')" data-target="activity">
            <i class="fa-solid fa-phone-volume"></i><span>활동·문의</span>
        </button>
    </nav>
</div>

<!-- 바텀시트 (밭 상세 / 내 땅 등록 공용) -->
<div id="modal-backdrop" class="backdrop hidden" onclick="closeSheet()">
    <div id="field-detail-sheet" class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <div class="sheet__grab"></div>
        <div id="sheet-content"></div>
    </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
